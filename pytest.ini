[pytest]
testpaths = tests
addopts = --import-mode=importlib
markers =
    postgresql18_staging: isolated PostgreSQL 18 staging-schema integration test; never production import
    v1_5_formal_gate: V1.5 formal open-flow evidence, QC, report, pressure-channel, no-write, and review release gate.
    v1_5_diagnostic_gate: V1.5 diagnostic/engineering tests that must not be treated as formal real acceptance.
    v1_5_legacy_pressure_diagnostic: V1.5 sealed pressure, VENT-hold, OUTP, or PACE diagnostic legacy tests kept outside the formal CO2/H2O gate.
